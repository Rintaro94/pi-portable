name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Vet launcher
        working-directory: launcher
        run: GOOS=windows go vet ./...

      - uses: actions/cache@v4
        with:
          path: .work/dl
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PiPortable
          path: |
            dist/PiPortable.zip
            dist/PiPortable.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PiPortable
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PiPortable.zip dist/PiPortable.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
