name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check CHANGELOG.md has notes for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > /dev/null

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Vet launcher
        working-directory: launcher
        run: |
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

      - uses: actions/cache@v4
        with:
          path: .work/dl
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PiPortable
          path: |
            dist/PiPortable-*
            dist/SHA256SUMS
          if-no-files-found: error

  # Run each package on its own OS: launcher starts, plugins load, blocked
  # commands stay blocked. darwin-x64 has no hosted runner here and is only
  # checked for architecture at build time.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-2025 }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PiPortable
          path: dist

      - name: Extract
        run: |
          mkdir -p t && cd t
          if [ "${{ matrix.target }}" = windows-x64 ]; then
            unzip -q ../dist/PiPortable-windows-x64.zip
          else
            tar xzf ../dist/PiPortable-${{ matrix.target }}.tar.gz
          fi

      - name: Smoke test
        working-directory: t/PiPortable
        run: |
          set -x
          ./pi --version | tee version.txt
          grep -qx '1\.[0-9]*\.[0-9]*' version.txt
          ./pi list | tee list.txt
          [ "$(grep -c '^  \./' list.txt)" -eq 4 ]
          if ./pi install npm:nothing; then echo "install was not blocked"; exit 1; fi
          ./pi --offline --list-models 2>&1 | tee models.txt
          ! grep -qi 'failed to load extension' models.txt
          ls tmp/pi-cliproxyapi-provider/openai-codex-responses-cpa-*.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PiPortable
          path: dist

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PiPortable-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Pi Portable $GITHUB_REF_NAME" --notes-file notes.md
