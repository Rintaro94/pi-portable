name: build

# Builds and smoke-tests every package. Pushes to main and releases run it
# through release.yml, the daily upstream check through upstream.yml.
# It never sees the signing key.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "commit or branch to build (default: the triggering commit)"
        type: string
        default: ""
      version:
        description: release tag written to VERSION, or "dev"
        type: string
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check CHANGELOG.md has notes for this version
        if: inputs.version != '' && inputs.version != 'dev'
        run: python3 scripts/release-notes.py "${{ inputs.version }}" > /dev/null

      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false

      - name: Vet launcher
        working-directory: launcher
        run: |
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go vet ./...
          done

      - uses: actions/cache@v4
        with:
          path: .work/dl
          key: sources-${{ hashFiles('sources.lock') }}

      - name: Build
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PiPortable
          path: |
            dist/PiPortable-*
            dist/SHA256SUMS
          if-no-files-found: error

  # Run each package on its own OS: launcher starts, plugins load, blocked
  # commands stay blocked. darwin-x64 has no hosted runner here and is only
  # checked for architecture at build time.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, os: windows-2025 }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PiPortable
          path: dist

      - name: Extract
        run: |
          mkdir -p t && cd t
          if [ "${{ matrix.target }}" = windows-x64 ]; then
            unzip -q ../dist/PiPortable-windows-x64.zip
          else
            tar xzf ../dist/PiPortable-${{ matrix.target }}.tar.gz
          fi

      - name: Smoke test
        working-directory: t/PiPortable
        run: |
          set -x
          ./pi --version | tee version.txt
          grep -qx '1\.[0-9]*\.[0-9]*' version.txt
          ./pi list | tee list.txt
          [ "$(grep -c '^  \./' list.txt)" -eq 4 ]
          if ./pi install npm:nothing; then echo "install was not blocked"; exit 1; fi
          ./pi --offline --list-models 2>&1 | tee models.txt
          ! grep -qi 'failed to load extension' models.txt
          ls tmp/pi-cliproxyapi-provider/openai-codex-responses-cpa-*.mjs
          cat VERSION
          if [ "${{ matrix.target }}" = windows-x64 ]; then ls update.bat; else test -x update.sh; fi

