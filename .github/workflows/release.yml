# Every push to main is built and smoke-tested. If the top section of
# CHANGELOG.md names a tag that is not released yet, the release job then
# waits for approval in the "release" environment, signs SHA256SUMS with the
# environment secret RELEASE_SIGNING_KEY, tags the commit and publishes.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream.py release-plan

  build:
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.plan.outputs.tag || 'dev' }}

  release:
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: PiPortable
          path: dist

      - name: Check the tag again
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream.py verify-tag "$TAG"

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::secret RELEASE_SIGNING_KEY is not set in the release environment; 'pi update' refuses unsigned releases"; exit 1
          fi
          umask 077; key=$RUNNER_TEMP/release-key.pem
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$key"
          # The signature must verify against the public key built into the launcher.
          pub=$(sed -n 's/^var releasePublicKey = "\(.*\)"$/\1/p' launcher/update.go)
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; echo "$pub" | base64 -d; } > "$RUNNER_TEMP/pub.der"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" -rawin \
            -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig

      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release-notes.py "$TAG" > notes.md

      - name: Publish release
        run: |
          gh release create "$TAG" dist/PiPortable-* dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pi Portable $TAG" --notes-file notes.md
